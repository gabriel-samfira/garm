<tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
    <td class="px-3 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">
        <a href="/web/instances/{{.Name}}/detail?from=enterprise&entity_id={{.EntityID}}" 
           class="text-gray-900 dark:text-white hover:text-gray-700 dark:hover:text-gray-300 hover:underline">
            {{.Name}}
        </a>
    </td>
    <td class="px-3 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">{{.CreatedTime}}</td>
    <td class="px-3 py-4 whitespace-nowrap">
        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full {{.StatusClass}}">{{.Status}}</span>
    </td>
    <td class="px-3 py-4 whitespace-nowrap">
        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">{{.RunnerStatus}}</span>
    </td>
</tr>
