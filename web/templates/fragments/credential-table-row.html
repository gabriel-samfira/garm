<tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900 dark:text-white">{{.Name}}</div>
    </td>
    <td class="px-3 py-4 whitespace-nowrap">
        <div class="text-sm text-gray-900 dark:text-white">{{.Description}}</div>
    </td>
    <td class="px-3 py-4 whitespace-nowrap">
        <div class="text-sm text-gray-900 dark:text-white">{{.ForgeIcon}}{{.EndpointName}}</div>
    </td>
    <td class="px-3 py-4 whitespace-nowrap">
        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full {{.AuthTypeBadge}}">
            {{.AuthTypeText}}
        </span>
    </td>
    <td class="px-3 py-4 whitespace-nowrap text-right text-sm font-medium">
        <div class="flex space-x-2 justify-end">
            <button hx-get="/web/credentials/{{.ID}}/edit" 
                    hx-target="#modal-container"
                    class="text-green-600 dark:text-green-400 hover:text-green-900 dark:hover:text-green-300 transition-colors">
                Edit
            </button>
            <button hx-delete="/web/api/credentials/{{.ID}}" 
                    hx-confirm="Are you sure you want to delete this credential?"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    class="text-red-600 dark:text-red-400 hover:text-red-900 dark:hover:text-red-300 transition-colors">
                Delete
            </button>
        </div>
    </td>
</tr>
