<tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
    <td class="px-4 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <div class="min-w-0 flex-1">
                <a href="/web/instances/{{.Name}}/detail" class="text-sm font-medium text-gray-900 dark:text-white hover:text-gray-700 dark:hover:text-gray-300 hover:underline">{{.Name}}</a>
                <div class="text-sm text-gray-500 dark:text-gray-400 truncate">{{.ID}}</div>
            </div>
        </div>
    </td>
    <td class="px-3 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white min-w-0">
        <div class="truncate">{{.PoolID}}</div>
    </td>
    <td class="px-3 py-4 whitespace-nowrap w-28 text-sm text-gray-500 dark:text-gray-400">{{.CreatedTime}}</td>
    <td class="px-3 py-4 whitespace-nowrap w-24">
        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full {{.StatusClass}}">{{.Status}}</span>
    </td>
    <td class="px-3 py-4 whitespace-nowrap w-32">
        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full {{.RunnerStatusClass}}">{{.RunnerStatus}}</span>
    </td>
    <td class="px-3 py-4 whitespace-nowrap text-right text-sm font-medium">
        <button hx-delete="/web/api/instances/{{.Name}}" 
                hx-target="#instances-table" 
                hx-confirm="Are you sure you want to delete this instance?"
                class="text-red-600 dark:text-red-400 hover:text-red-900 dark:hover:text-red-300">Delete</button>
    </td>
</tr>
