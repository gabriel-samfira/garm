{{define "repositories-content"}}
<!-- Repository List -->
<div class="bg-white dark:bg-gray-800 rounded-lg shadow">
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <div class="flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Repositories</h3>
        </div>
        <!-- Search Bar -->
        <div class="mt-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" 
                       id="repositories-search" 
                       name="search"
                       class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md leading-5 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                       placeholder="Search repositories by name or owner..." 
                       hx-get="/web/api/repositories"
                       hx-target="#repositories-table"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-include="[name='page'],[name='per_page']">
            </div>
        </div>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Name</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Owner</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Endpoint</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Credential</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                    <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="repositories-table" 
                   hx-get="/web/api/repositories" 
                   hx-trigger="load, every 30s, refresh" 
                   hx-indicator="#loading" 
                   hx-include="[name='page'],[name='per_page'],[name='search']"
                   class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                <tr>
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading repositories...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Pagination Controls -->
    <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-700 dark:text-gray-300">Show</span>
                <select name="per_page" 
                        hx-post="/web/api/repositories" 
                        hx-target="#repositories-table"
                        hx-include="[name='page'],[name='search']"
                        class="border border-gray-300 dark:border-gray-600 rounded-md px-3 py-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span class="text-sm text-gray-700 dark:text-gray-300">per page</span>
            </div>
            
            <div id="pagination-info" class="text-sm text-gray-700 dark:text-gray-300">
                Showing repositories
            </div>
            
            <div class="flex items-center space-x-2">
                <input type="hidden" id="current-page" name="page" value="1">
                <button type="button" 
                        id="prev-page"
                        onclick="changePage(-1)" 
                        disabled
                        class="px-3 py-1 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous
                </button>
                <span id="page-numbers" class="text-sm text-gray-700 dark:text-gray-300">Page 1</span>
                <button type="button" 
                        id="next-page"
                        onclick="changePage(1)"
                        class="px-3 py-1 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Container -->
<div id="modal-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize pagination for repositories
    window.entityPagination = createEntityPagination({
        entityType: 'repositories',
        tableId: 'repositories-table',
        searchInputId: 'repositories-search',
        apiEndpoint: '/web/api/repositories',
        searchPlaceholder: 'Search repositories by name or owner...'
    });
    
    window.entityPagination.init();
});
</script>
{{end}}
