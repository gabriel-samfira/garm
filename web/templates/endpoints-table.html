{{define "endpoints-table"}}
{{if .Endpoints}}
    {{range .Endpoints}}
    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
        <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900 dark:text-white">{{.Name}}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm text-gray-900 dark:text-white">{{.Description}}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm text-gray-900 dark:text-white">{{.APIURL}}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm text-gray-900 dark:text-white">{{.UploadURL}}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <div class="flex space-x-2">
                <button hx-get="/web/endpoints/{{.Name}}/edit" 
                        hx-target="#modal-container"
                        class="text-blue-600 dark:text-blue-400 hover:text-blue-900 dark:hover:text-blue-300 transition-colors">
                    Edit
                </button>
                <button hx-delete="/web/api/endpoints/{{.Name}}" 
                        hx-confirm="Are you sure you want to delete this endpoint?"
                        hx-target="closest tr"
                        hx-swap="outerHTML"
                        class="text-red-600 dark:text-red-400 hover:text-red-900 dark:hover:text-red-300 transition-colors">
                    Delete
                </button>
            </div>
        </td>
    </tr>
    {{end}}
{{else}}
    <tr>
        <td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">
            <div class="flex flex-col items-center py-8">
                <svg class="w-12 h-12 text-gray-400 dark:text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9v-9m0-9v9"></path>
                </svg>
                <p class="text-sm">No endpoints configured</p>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Add an endpoint to get started</p>
            </div>
        </td>
    </tr>
{{end}}
{{end}}
