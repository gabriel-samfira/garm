<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - GARM</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/json-enc.js"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen h-full" 
      x-data="{ 
          theme: localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
          toggleTheme() {
              this.theme = this.theme === 'dark' ? 'light' : 'dark';
              localStorage.setItem('theme', this.theme);
              document.documentElement.classList.toggle('dark', this.theme === 'dark');
          }
      }" 
      x-init="document.documentElement.classList.toggle('dark', theme === 'dark')" 
      :class="theme === 'dark' ? 'dark' : ''">
    <!-- Navigation -->
    <nav class="bg-blue-600 dark:bg-blue-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex items-center space-x-3">
                        <img :src="theme === 'dark' ? '/assets/garm-dark.svg' : '/assets/garm-light.svg'" 
                             alt="GARM Logo" 
                             class="h-8 w-8">
                        <h1 class="text-xl font-bold">
                            <a href="/web/" class="hover:text-blue-200 dark:hover:text-blue-300">GARM</a>
                        </h1>
                    </div>
                    <div class="hidden md:flex space-x-4">
                        <a href="/web/repositories" 
                           class="px-3 py-2 rounded hover:bg-blue-700 {{if eq .ActivePage "repositories"}}bg-blue-700{{end}}">
                            Repositories
                        </a>
                        <a href="/web/organizations" 
                           class="px-3 py-2 rounded hover:bg-blue-700 {{if eq .ActivePage "organizations"}}bg-blue-700{{end}}">
                            Organizations
                        </a>
                        <a href="/web/pools" 
                           class="px-3 py-2 rounded hover:bg-blue-700 {{if eq .ActivePage "pools"}}bg-blue-700{{end}}">
                            Pools
                        </a>
                        <a href="/web/instances" 
                           class="px-3 py-2 rounded hover:bg-blue-700 {{if eq .ActivePage "instances"}}bg-blue-700{{end}}">
                            Instances
                        </a>
                        <a href="/web/credentials" 
                           class="px-3 py-2 rounded hover:bg-blue-700 {{if eq .ActivePage "credentials"}}bg-blue-700{{end}}">
                            Credentials
                        </a>
                        <a href="/web/endpoints" 
                           class="px-3 py-2 rounded hover:bg-blue-700 {{if eq .ActivePage "endpoints"}}bg-blue-700{{end}}">
                            Endpoints
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button @click="toggleTheme()" 
                            class="p-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-700 transition-colors"
                            title="Toggle theme">
                        <svg x-show="theme === 'light'" class="w-5 h-5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                        <svg x-show="theme === 'dark'" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                    </button>
                    <span class="text-sm text-blue-200 dark:text-blue-300">GitHub Actions Runner Manager</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {{template "credentials-content" .}}
    </main>

    <!-- Loading indicator -->
    <div id="loading" class="htmx-indicator fixed top-4 right-4 bg-blue-600 dark:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
            <span>Loading...</span>
        </div>
    </div>

    <!-- Global error handling -->
    <div id="error-toast" class="fixed top-4 right-4 bg-red-600 dark:bg-red-700 text-white px-4 py-2 rounded-lg shadow-lg hidden">
        <div class="flex items-center space-x-2">
            <span id="error-message">An error occurred</span>
            <button onclick="document.getElementById('error-toast').classList.add('hidden')" class="ml-2 text-white hover:text-gray-200 dark:hover:text-gray-300">×</button>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="/static/js/app.js"></script>
</body>
</html>
