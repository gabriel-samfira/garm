<!-- Modal Background -->
<div class="fixed inset-0 bg-gray-600 bg-opacity-50 dark:bg-gray-900 dark:bg-opacity-50 overflow-y-auto h-full w-full" id="endpoint-modal">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 xl:w-1/3 shadow-lg rounded-md bg-white dark:bg-gray-800">
        <div class="mt-3">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Add New Endpoint</h3>
                <button onclick="document.getElementById('endpoint-modal').remove()" 
                        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <span class="sr-only">Close</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Forge Type Selection -->
            <div id="forge-type-selection" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">Select Forge Type</label>
                    <div class="grid grid-cols-2 gap-4">
                        <!-- GitHub Option -->
                        <button type="button" 
                                onclick="selectForgeType('github')"
                                class="forge-type-btn p-6 border-2 border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-500 dark:hover:border-blue-400 focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors">
                            <div class="flex flex-col items-center space-y-2">
                                <svg class="w-12 h-12 dark:hidden" width="98" height="96" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 96">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z" fill="#24292f"/>
                                </svg>
                                <svg class="w-12 h-12 hidden dark:block" width="98" height="96" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 96">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z" fill="#fff"/>
                                </svg>
                                <span class="text-sm font-medium text-gray-900 dark:text-white">GitHub</span>
                            </div>
                        </button>
                        
                        <!-- Gitea Option -->
                        <button type="button" 
                                onclick="selectForgeType('gitea')"
                                class="forge-type-btn p-6 border-2 border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-500 dark:hover:border-blue-400 focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors">
                            <div class="flex flex-col items-center space-y-2">
                                <svg class="w-12 h-12" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 640">
                                    <path d="m395.9 484.2-126.9-61c-12.5-6-17.9-21.2-11.8-33.8l61-126.9c6-12.5 21.2-17.9 33.8-11.8 17.2 8.3 27.1 13 27.1 13l-.1-109.2 16.7-.1.1 117.1s57.4 24.2 83.1 40.1c3.7 2.3 10.2 6.8 12.9 14.4 2.1 6.1 2 13.1-1 19.3l-61 126.9c-6.2 12.7-21.4 18.1-33.9 12" style="fill:#fff"/>
                                    <path d="M622.7 149.8c-4.1-4.1-9.6-4-9.6-4s-117.2 6.6-177.9 8c-13.3.3-26.5.6-39.6.7v117.2c-5.5-2.6-11.1-5.3-16.6-7.9 0-36.4-.1-109.2-.1-109.2-29 .4-89.2-2.2-89.2-2.2s-141.4-7.1-156.8-8.5c-9.8-.6-22.5-2.1-39 1.5-8.7 1.8-33.5 7.4-53.8 26.9C-4.9 212.4 6.6 276.2 8 285.8c1.7 11.7 6.9 44.2 31.7 72.5 45.8 56.1 144.4 54.8 144.4 54.8s12.1 28.9 30.6 55.5c25 33.1 50.7 58.9 75.7 62 63 0 188.9-.1 188.9-.1s12 .1 28.3-10.3c14-8.5 26.5-23.4 26.5-23.4S547 483 565 451.5c5.5-9.7 10.1-19.1 14.1-28 0 0 55.2-117.1 55.2-231.1-1.1-34.5-9.6-40.6-11.6-42.6M125.6 353.9c-25.9-8.5-36.9-18.7-36.9-18.7S69.6 321.8 60 295.4c-16.5-44.2-1.4-71.2-1.4-71.2s8.4-22.5 38.5-30c13.8-3.7 31-3.1 31-3.1s7.1 59.4 15.7 94.2c7.2 29.2 24.8 77.7 24.8 77.7s-26.1-3.1-43-9.1m300.3 107.6s-6.1 14.5-19.6 15.4c-5.8.4-10.3-1.2-10.3-1.2s-.3-.1-5.3-2.1l-112.9-55s-10.9-5.7-12.8-15.6c-2.2-8.1 2.7-18.1 2.7-18.1L322 273s4.8-9.7 12.2-13c.6-.3 2.3-1 4.5-1.5 8.1-2.1 18 2.8 18 2.8L467.4 315s12.6 5.7 15.3 16.2c1.9 7.4-.5 14-1.8 17.2-6.3 15.4-55 113.1-55 113.1" style="fill:#609926"/>

                                </svg>
                                <span class="text-sm font-medium text-gray-900 dark:text-white">Gitea</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Endpoint Form (Hidden initially) -->
            <div id="endpoint-form" class="hidden">
                <form hx-post="/web/api/endpoints" 
                      hx-target="#endpoint-modal"
                      hx-swap="outerHTML"
                      hx-on:htmx:after-success="htmx.trigger('#endpoints-table', 'refresh')"
                      class="space-y-4">
                    
                    <input type="hidden" id="endpoint_type" name="endpoint_type" value="">
                    
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
                        <input type="text" 
                               id="name" 
                               name="name" 
                               required
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="e.g., github-enterprise or github-com">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                        <textarea id="description" 
                                  name="description" 
                                  rows="2"
                                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                                  placeholder="Enter description (optional)"></textarea>
                    </div>

                    <div>
                        <label for="base_url" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Base URL</label>
                        <input type="url" 
                               id="base_url" 
                               name="base_url" 
                               required
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="https://github.com or https://your-gitea-instance.com">
                    </div>

                    <div>
                        <label for="api_base_url" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            API Base URL <span id="api-url-optional" class="text-xs text-gray-500 hidden">(Optional - will use Base URL if empty)</span>
                        </label>
                        <input type="url" 
                               id="api_base_url" 
                               name="api_base_url" 
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="https://api.github.com or https://your-instance.com/api/v1">
                    </div>

                    <!-- GitHub-only field -->
                    <div id="upload_base_url_field" class="hidden">
                        <label for="upload_base_url" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Upload Base URL</label>
                        <input type="url" 
                               id="upload_base_url" 
                               name="upload_base_url" 
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="https://uploads.github.com">
                    </div>

                    <!-- CA Certificate Upload -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">CA Certificate Bundle (Optional)</label>
                        <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-4 text-center hover:border-blue-400 dark:hover:border-blue-400 transition-colors" 
                             ondrop="handleCACertDrop(event)" ondragover="handleCACertDragOver(event)">
                            <input type="file" 
                                   id="ca_cert_file" 
                                   name="ca_cert_file" 
                                   accept=".pem,.crt,.cer" 
                                   onchange="handleCACertUpload(this)"
                                   class="hidden">
                            <div class="space-y-2">
                                <svg class="mx-auto h-8 w-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                <p class="text-sm text-gray-600 dark:text-gray-400">
                                    <button type="button" onclick="document.getElementById('ca_cert_file').click()" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">
                                        Choose a file
                                    </button>
                                    or drag and drop
                                </p>
                                <p class="text-xs text-gray-500 dark:text-gray-400">PEM, CRT, CER files only</p>
                            </div>
                            <div id="ca_cert_info" class="hidden mt-2 p-2 bg-green-50 dark:bg-green-900/20 rounded text-sm text-green-700 dark:text-green-300"></div>
                        </div>
                        <input type="hidden" id="ca_cert_bundle" name="ca_cert_bundle" value="">
                    </div>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" 
                                onclick="document.getElementById('endpoint-modal').remove()"
                                class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                            Cancel
                        </button>
                        <button type="submit"
                                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            Create Endpoint
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function selectForgeType(type) {
    // Hide forge type selection and show form
    const forgeSelection = document.getElementById('forge-type-selection');
    const endpointForm = document.getElementById('endpoint-form');
    
    if (forgeSelection) {
        forgeSelection.classList.add('hidden');
    }
    if (endpointForm) {
        endpointForm.classList.remove('hidden');
    }
    
    // Set the endpoint type
    const endpointTypeField = document.getElementById('endpoint_type');
    if (endpointTypeField) {
        endpointTypeField.value = type;
    }
    
    // Configure form based on forge type
    if (type === 'github') {
        const uploadField = document.getElementById('upload_base_url_field');
        const apiOptional = document.getElementById('api-url-optional');
        const apiBaseUrl = document.getElementById('api_base_url');
        const baseUrl = document.getElementById('base_url');
        
        if (uploadField) uploadField.classList.remove('hidden');
        if (apiOptional) apiOptional.classList.add('hidden');
        if (apiBaseUrl) {
            apiBaseUrl.required = true;
            apiBaseUrl.placeholder = 'https://api.github.com or https://your-github-enterprise.com/api/v3';
        }
        if (baseUrl) {
            baseUrl.placeholder = 'https://github.com or https://your-github-enterprise.com';
        }
    } else if (type === 'gitea') {
        const uploadField = document.getElementById('upload_base_url_field');
        const apiOptional = document.getElementById('api-url-optional');
        const apiBaseUrl = document.getElementById('api_base_url');
        
        if (uploadField) uploadField.classList.add('hidden');
        if (apiOptional) apiOptional.classList.remove('hidden');
        if (apiBaseUrl) apiBaseUrl.required = false;
        
        // Update placeholders for Gitea
        const baseUrlGitea = document.getElementById('base_url');
        const apiBaseUrlGitea = document.getElementById('api_base_url');
        
        if (baseUrlGitea) {
            baseUrlGitea.placeholder = 'https://your-gitea-instance.com';
        }
        if (apiBaseUrlGitea) {
            apiBaseUrlGitea.placeholder = 'https://your-gitea-instance.com/api/v1';
        }
    }
}

function handleCACertUpload(input) {
    const file = input.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const base64 = btoa(e.target.result);
        const caCertBundle = document.getElementById('ca_cert_bundle');
        const caCertInfo = document.getElementById('ca_cert_info');
        
        if (caCertBundle) {
            caCertBundle.value = base64;
        }
        if (caCertInfo) {
            caCertInfo.textContent = `Certificate uploaded: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            caCertInfo.classList.remove('hidden');
        }
    };
    reader.readAsBinaryString(file);
}

function handleCACertDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('border-blue-400', 'bg-blue-50', 'dark:bg-blue-900/20');
}

function handleCACertDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('border-blue-400', 'bg-blue-50', 'dark:bg-blue-900/20');
    
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        document.getElementById('ca_cert_file').files = files;
        handleCACertUpload(document.getElementById('ca_cert_file'));
    }
}

// Remove drag styling when dragging leaves the area
document.addEventListener('DOMContentLoaded', function() {
    const dropArea = document.querySelector('[ondrop="handleCACertDrop(event)"]');
    if (dropArea) {
        dropArea.addEventListener('dragleave', function(e) {
            if (!this.contains(e.relatedTarget)) {
                this.classList.remove('border-blue-400', 'bg-blue-50', 'dark:bg-blue-900/20');
            }
        });
    }
});
</script>
