<!-- Modal Background -->
<div class="fixed inset-0 bg-gray-600 bg-opacity-50 dark:bg-gray-900 dark:bg-opacity-50 overflow-y-auto h-full w-full" id="credential-modal">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 xl:w-1/3 shadow-lg rounded-md bg-white dark:bg-gray-800">
        <div class="mt-3">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Add New Credential</h3>
                <button onclick="document.getElementById('credential-modal').remove()" 
                        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <span class="sr-only">Close</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form hx-post="/web/api/credentials" 
                  hx-target="#credential-result"
                  hx-ext="json-enc"
                  x-data="{ authType: 'pat', showAdvanced: false }"
                  class="space-y-4">
                
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           required
                           class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                           placeholder="Enter credential name">
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                    <textarea id="description" 
                              name="description" 
                              rows="2"
                              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                              placeholder="Enter description (optional)"></textarea>
                </div>

                <div>
                    <label for="endpoint" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Endpoint</label>
                    <select id="endpoint" 
                            name="endpoint" 
                            required
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                        <option value="">Select an endpoint</option>
                        {{range .Endpoints}}
                        <option value="{{.Name}}">{{.Name}} - {{.Description}}</option>
                        {{end}}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Authentication Type</label>
                    <div class="space-y-2">
                        <label class="inline-flex items-center">
                            <input type="radio" 
                                   name="auth_type" 
                                   value="pat" 
                                   x-model="authType"
                                   class="form-radio text-blue-600 dark:text-blue-400">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Personal Access Token</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" 
                                   name="auth_type" 
                                   value="app" 
                                   x-model="authType"
                                   class="form-radio text-blue-600 dark:text-blue-400">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">GitHub App</span>
                        </label>
                    </div>
                </div>

                <!-- Personal Access Token fields -->
                <div x-show="authType === 'pat'" class="space-y-4">
                    <div>
                        <label for="pat_token" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Personal Access Token</label>
                        <input type="password" 
                               id="pat_token" 
                               name="pat.token"
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="ghp_...">
                    </div>
                </div>

                <!-- GitHub App fields -->
                <div x-show="authType === 'app'" class="space-y-4">
                    <div>
                        <label for="app_id" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">App ID</label>
                        <input type="number" 
                               id="app_id" 
                               name="app.app_id"
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="123456">
                    </div>
                    
                    <div>
                        <label for="installation_id" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Installation ID</label>
                        <input type="number" 
                               id="installation_id" 
                               name="app.installation_id"
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="12345678">
                    </div>
                    
                    <div>
                        <label for="private_key" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Private Key</label>
                        <textarea id="private_key" 
                                  name="app.private_key_bytes" 
                                  rows="6"
                                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white font-mono text-xs"
                                  placeholder="-----BEGIN RSA PRIVATE KEY-----&#10;...&#10;-----END RSA PRIVATE KEY-----"></textarea>
                    </div>
                </div>

                <div id="credential-result" class="mt-4"></div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" 
                            onclick="document.getElementById('credential-modal').remove()"
                            class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 rounded-md transition-colors">
                        Cancel
                    </button>
                    <button type="submit" 
                            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 rounded-md transition-colors">
                        Create Credential
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.xhr.status === 200 && evt.detail.target.id === 'credential-result') {
        // Credential created successfully
        document.getElementById('credential-modal').remove();
        // Refresh the credentials table
        htmx.trigger('#credentials-table', 'htmx:afterRequest');
    }
});
</script>
