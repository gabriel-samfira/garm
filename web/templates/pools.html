{{define "pools-content"}}
<!-- Pool List -->
<div class="bg-white dark:bg-gray-800 rounded-lg shadow">
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <div class="flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Runner Pools</h3>
        </div>
        <!-- Search Bar -->
        <div class="mt-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" 
                       id="pools-search" 
                       name="search"
                       class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md leading-5 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                       placeholder="Search pools by entity name..." 
                       hx-post="/web/api/pools"
                       hx-target="#pools-table"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-include="[name='page'],[name='per_page']">
            </div>
        </div>
    </div>
    
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">ID</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Image</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Entity</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Endpoint</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="pools-table" 
                   hx-get="/web/api/pools" 
                   hx-trigger="load, every 30s" 
                   hx-indicator="#loading" 
                   hx-include="[name='page'],[name='per_page'],[name='search']"
                   class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                <tr>
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">Loading pools...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Pagination Controls -->
    <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-700 dark:text-gray-300">Show</span>
                <select name="per_page" 
                        hx-post="/web/api/pools" 
                        hx-target="#pools-table"
                        hx-include="[name='page'],[name='search']"
                        class="border border-gray-300 dark:border-gray-600 rounded-md px-3 py-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span class="text-sm text-gray-700 dark:text-gray-300">per page</span>
            </div>
            
            <div id="pagination-info" class="text-sm text-gray-700 dark:text-gray-300">
                Showing pools
            </div>
            
            <div class="flex items-center space-x-2">
                <input type="hidden" id="current-page" name="page" value="1">
                <button type="button" 
                        id="prev-page"
                        onclick="changePage(-1)"
                        disabled
                        class="px-3 py-1 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous
                </button>
                <span id="page-numbers" class="text-sm text-gray-700 dark:text-gray-300">Page 1</span>
                <button type="button" 
                        id="next-page"
                        onclick="changePage(1)"
                        class="px-3 py-1 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Container -->
<div id="modal-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize pagination for pools
    window.entityPagination = createEntityPagination({
        entityType: 'pools',
        tableId: 'pools-table',
        searchInputId: 'pools-search',
        apiEndpoint: '/web/api/pools',
        searchPlaceholder: 'Search pools by entity name...'
    });
    
    window.entityPagination.init();
});

// Pool deletion functions
function showDeleteConfirm(poolId, poolDisplayId) {
    const modal = document.createElement('div');
    modal.innerHTML = `
        <div class="fixed inset-0 bg-black bg-opacity-50 dark:bg-gray-900 dark:bg-opacity-75 flex items-center justify-center z-50" 
             onclick="this.remove()">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
                <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Confirm Delete</h3>
                </div>
                
                <div class="p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <svg class="w-8 h-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm text-gray-900 dark:text-white">Are you sure you want to delete pool <strong>${poolDisplayId}</strong>? This action cannot be undone.</p>
                        </div>
                    </div>
                </div>
                
                <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-3">
                    <button onclick="this.closest('.fixed').remove()" 
                            class="px-4 py-2 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-white rounded-lg font-medium">
                        Cancel
                    </button>
                    <button onclick="deletePool('${poolId}'); this.closest('.fixed').remove()" 
                            class="px-4 py-2 bg-red-600 hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-800 text-white rounded-lg font-medium">
                        Delete Pool
                    </button>
                </div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function deletePool(poolId) {
    fetch('/web/api/pools/' + poolId, {
        method: 'DELETE',
        headers: {
            'Content-Type': 'application/json',
        }
    })
    .then(response => {
        if (response.ok) {
            return response.text();
        }
        throw new Error('Failed to delete pool');
    })
    .then(html => {
        document.getElementById('pools-table').innerHTML = html;
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Failed to delete pool: ' + error.message);
    });
}
</script>
{{end}}
