<!-- Modal Background -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" 
     onclick="this.remove()">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
        <div class="px-6 py-4 border-b border-gray-200">
            <h3 class="text-lg font-semibold text-gray-900">
                {{if .Enterprise}}Edit Enterprise{{else}}Add Enterprise{{end}}
            </h3>
        </div>
        
        <form hx-post="{{if .Enterprise}}/web/api/enterprises/{{.Enterprise.ID}}{{else}}/web/api/enterprises{{end}}" 
              hx-target="#enterprises-table" 
              hx-indicator="#loading"
              class="p-6 space-y-4">
            
            {{if .Enterprise}}
            <input type="hidden" name="_method" value="PUT">
            {{end}}
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Enterprise Name</label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       value="{{if .Enterprise}}{{.Enterprise.Name}}{{end}}"
                       {{if .Enterprise}}readonly{{end}}
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 {{if .Enterprise}}bg-gray-50 text-gray-500{{end}}" 
                       required>
            </div>
            
            <div>
                <label for="credentials_name" class="block text-sm font-medium text-gray-700 mb-1">Credentials</label>
                <select id="credentials_name" 
                        name="credentials_name" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500" 
                        required>
                    <option value="">Select credentials...</option>
                    {{range .Credentials}}
                    <option value="{{.Name}}" {{if $.Enterprise}}{{if eq $.Enterprise.CredentialsName .Name}}selected{{end}}{{end}}>
                        {{.Name}} ({{.AuthType}})
                    </option>
                    {{end}}
                </select>
            </div>
            
            <div>
                <label for="webhook_secret" class="block text-sm font-medium text-gray-700 mb-1">Webhook Secret (optional)</label>
                <input type="password" 
                       id="webhook_secret" 
                       name="webhook_secret" 
                       value="{{if .Enterprise}}{{.Enterprise.WebhookSecret}}{{end}}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
            </div>
            
            <div>
                <label for="pool_balancer_type" class="block text-sm font-medium text-gray-700 mb-1">Pool Balancer Type</label>
                <select id="pool_balancer_type" 
                        name="pool_balancer_type" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
                    <option value="">Default (Round Robin)</option>
                    <option value="roundrobin" {{if .Enterprise}}{{if eq .Enterprise.PoolBalancerType "roundrobin"}}selected{{end}}{{end}}>Round Robin</option>
                    <option value="pack" {{if .Enterprise}}{{if eq .Enterprise.PoolBalancerType "pack"}}selected{{end}}{{end}}>Pack</option>
                </select>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                <button type="button" 
                        onclick="document.getElementById('modal-container').innerHTML = ''"
                        class="px-4 py-2 text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-lg font-medium">
                    Cancel
                </button>
                <button type="submit" 
                        class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium">
                    {{if .Enterprise}}Update{{else}}Create{{end}}
                </button>
            </div>
        </form>
    </div>
</div>
