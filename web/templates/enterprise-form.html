<!-- Modal Background -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" 
     onclick="this.remove()">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                {{if .Enterprise}}Edit Enterprise{{else}}Add Enterprise{{end}}
            </h3>
        </div>
        
        <form hx-post="{{if .Enterprise}}/web/api/enterprises/{{.Enterprise.ID}}{{else}}/web/api/enterprises{{end}}" 
              hx-target="#enterprises-table" 
              hx-indicator="#loading"
              class="p-6 space-y-4">
            
            {{if .Enterprise}}
            <input type="hidden" name="_method" value="PUT">
            {{end}}
            
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Enterprise Name</label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       value="{{if .Enterprise}}{{.Enterprise.Name}}{{end}}"
                       {{if .Enterprise}}readonly{{end}}
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white {{if .Enterprise}}bg-gray-50 dark:bg-gray-600 text-gray-500 dark:text-gray-400{{end}}" 
                       required>
            </div>
            
            <div>
                <label for="credentials_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Credentials</label>
                <select id="credentials_name" 
                        name="credentials_name" 
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white" 
                        required>
                    <option value="">Select credentials...</option>
                    {{range .Credentials}}
                    <option value="{{.Name}}" {{if $.Enterprise}}{{if eq $.Enterprise.CredentialsName .Name}}selected{{end}}{{end}}>
                        {{.Name}} ({{.AuthType}})
                    </option>
                    {{end}}
                </select>
            </div>
            
            <div>
                <label for="webhook_secret" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Webhook Secret (optional)</label>
                <input type="password" 
                       id="webhook_secret" 
                       name="webhook_secret" 
                       value="{{if .Enterprise}}{{.Enterprise.WebhookSecret}}{{end}}"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
            </div>
            
            <div>
                <label for="pool_balancer_type" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Pool Balancer Type</label>
                <select id="pool_balancer_type" 
                        name="pool_balancer_type" 
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                    <option value="roundrobin" {{if and .Enterprise (eq .Enterprise.PoolBalancerType "roundrobin")}}selected{{else}}{{if not .Enterprise}}selected{{end}}{{end}}>Round Robin</option>
                    <option value="pack" {{if and .Enterprise (eq .Enterprise.PoolBalancerType "pack")}}selected{{end}}>Pack</option>
                </select>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                <button type="button" 
                        onclick="this.closest('.fixed').remove()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-600 hover:bg-gray-200 dark:hover:bg-gray-500 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    {{if .Enterprise}}Update Enterprise{{else}}Create Enterprise{{end}}
                </button>
            </div>
        </form>
    </div>
</div>
